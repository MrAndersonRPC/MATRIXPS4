<!DOCTYPE html>
<html lang="pt-BR" manifest="cache.appcache">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>MATRIXPS4</title>
<link rel="icon" type="image/png" href="logo_raw.png" />
<style>
  html, body { margin:0; padding:0; background:#0b0d10; color:#c8ced8; font:15px/1.45 "Segoe UI", system-ui, sans-serif; }
  #wrap { padding:16px 18px; }
  #state { font-size:22px; font-weight:700; margin:0 0 6px; }
  #det { font-size:13px; color:#8b95a3; margin:0 0 4px; }
  #det b { color:#c8ced8; font-weight:600; }
  #cache { font-size:12px; color:#5c6672; margin:0 0 10px; min-height:14px; }
  #cache.cacheok { color:#7fd0a0; }
  .ok { color:#7fd0a0; } .bad { color:#d08a7f; } .warn { color:#d8c07f; }
  #brand { text-align:center; padding:8px 10px; background:#0e1116; border-bottom:1px solid #1e2732; }
  #brand img { width:28px; height:28px; margin-right:8px; border-radius:50%; vertical-align:middle; }
  #brand b { font-size:15px; font-weight:700; letter-spacing:.14em; color:#e6ebf2; vertical-align:middle; }
  #warn { padding:14px 12px; background:#3a0f10; color:#ffdede; border-bottom:2px solid #a5202a; text-align:center; font-weight:900; font-size:16px; line-height:1.35; text-shadow:0 0 6px rgba(255,60,60,.45); }
  #warn b { color:#ff5666; }
  #foot { position:fixed; left:0; right:0; bottom:6px; text-align:center; font-size:12px; color:#5c6672; letter-spacing:.06em; line-height:1.5; }
  #foot b { color:#8b95a3; font-weight:600; }
</style>
</head>
<body>
<div id="brand"><img src="logo_raw.png" alt="logo"><b>MATRIXPS4</b></div>
<div id="warn">&#9888; Firmwares compatíveis: <b>11.00, 11.50, 12.00, 12.50, 13.00, 13.02, 13.04, 13.50 e 13.52</b> &#9888;</div>
<div id="wrap">
  <div id="state">detectando firmware...</div>
  <div id="det"></div>
  <div id="cache"></div>
</div>
<script>
(function () {
    var stateEl = document.getElementById("state");
    var detEl = document.getElementById("det");
    var cacheEl = document.getElementById("cache");
    function setState(t, cls) { stateEl.textContent = t; stateEl.className = cls || ""; }
    function fw() {
        var ua = navigator.userAgent || "";
        var m = ua.match(/PlayStation 4\s([0-9.]+)/i);
        return m ? m[1] : null;
    }
    var v = fw();
    detEl.innerHTML = v ? ('Firmware detectado: <b>' + v + '</b>') : 'Não foi possível detectar o firmware.';
    if (window.applicationCache) {
        window.applicationCache.addEventListener('cached', function(){ cacheEl.textContent = 'cache instalado'; cacheEl.className = 'cacheok'; });
        window.applicationCache.addEventListener('updateready', function(){ cacheEl.textContent = 'cache atualizado'; cacheEl.className = 'cacheok'; });
        window.applicationCache.addEventListener('noupdate', function(){ cacheEl.textContent = 'offline -- em cache'; cacheEl.className = 'cacheok'; });
    }
    if (!v) { setState('abra pelo navegador do PS4', 'warn'); return; }
    setState('abrindo host...', 'ok');
    setTimeout(function(){ location.href='jb.html'; }, 350);
})();
</script>
<div id="foot"><b>MATRIXPS4</b> • MrAndersonRPC</div>
</body>
</html>
