<html manifest="cache.appcache">
<head>
<meta charset="utf-8">
<title>MATRIXPS4 Cache</title>
<style>
body { background:#0b0d10; color:#e6ebf2; font:15px/1.45 "Segoe UI", system-ui, sans-serif; text-align:center; margin:0; overflow:hidden; }
.info { position:absolute; top:50%; left:50%; font-family:Consolas, monospace; font-size:16px; color:#c8ced8; transform:translate(-50%, -50%); letter-spacing:.04em; white-space:nowrap; }
.info b { color:#7fa0c6; font-weight:600; }
</style>
<script>
history.replaceState(null, null, 'index.html');
var histlength = history.length;
try { history.go(-histlength); } catch (e) {}
function DLProgress(e) {
    var msgs = document.getElementById("msgs");
    if (!msgs) return;
    var pct = e.total ? Math.round(e.loaded / e.total * 100) : 0;
    msgs.innerHTML = "MATRIXPS4 &middot; Instalando cache... <b>" + pct + "%</b>";
}
function DisplayCacheProgress() {
    var msgs = document.getElementById("msgs");
    setTimeout(function () {
        if (msgs) msgs.innerHTML = "MATRIXPS4 &middot; <b>Cache OK</b>";
    }, 400);
    setTimeout(function () {
        if (msgs) msgs.innerHTML = "MATRIXPS4 &middot; Cache concluído — recarregando host...";
        location.reload();
    }, 1400);
}
if (window.applicationCache) {
    window.applicationCache.addEventListener("progress", DLProgress, false);
    window.applicationCache.oncached = function () { DisplayCacheProgress(); };
    window.applicationCache.onupdateready = function () { DisplayCacheProgress(); };
    window.applicationCache.addEventListener("noupdate", function () {
        var msgs = document.getElementById("msgs");
        if (msgs) msgs.innerHTML = "MATRIXPS4 &middot; <b>Cache já disponível</b>";
        setTimeout(function(){ location.reload(); }, 1000);
    }, false);
}
</script>
</head>
<body>
<div id="msgs" class="info"><b>Aguardando cache...</b></div>
</body>
</html>
